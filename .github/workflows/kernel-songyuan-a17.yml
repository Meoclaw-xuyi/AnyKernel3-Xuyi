name: songyuan 专用 - 官方基底 A17 内核打包

# songyuan（REDMI K100 Pro Max，高通，HyperOS4/Android 17）专用：
# 不从 AOSP 源码编译（会缺小米/高通 built-in 驱动，导致没网/马达回退/卡顿），
# 而是以 KSU 预编译 GKI 内核（ReSukiSU/SukiSU 官方发布，已含 KernelSU）为基底：
#   1. 下载内核（支持 Image / Image.gz / boot.img）
#   2. 按内核版本自动还原 LZ4 符号 CRC 为官方值（修复厂商模块拒载不开机）
#   3. 套用本仓库的 A17 门控刷入模板（仅 Android 17 系统可刷入）
#   4. 打成 AnyKernel3 卡刷包
# 产出 = 官方级硬件兼容 + A17 专用门控。

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "KSU 预编译 GKI 内核直链（Image / Image.gz / boot.img 均可）"
        required: true
        type: string
      kernel_version:
        description: "内核版本（选择 CRC 官方表：6.12=android16 KMI，6.6=android15-8 KMI）"
        required: true
        type: choice
        options:
          - "6.12"
          - "6.6"
        default: "6.12"
      version_name:
        description: "版本名（可选，默认 songyuan-a17-<内核版本>）"
        required: false
        type: string
        default: ""
      release_tag:
        description: "同时上传到指定 Release 的 tag（留空仅上传 Artifact）"
        required: false
        type: string
        default: ""

jobs:
  pack-songyuan:
    name: songyuan A17 AK3 打包
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库（CRC 还原脚本 + A17 门控模板）
        uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 python3 zip

      - name: 下载内核
        run: |
          mkdir -p work
          curl -fL --retry 3 --retry-delay 5 -o work/input.bin "${{ inputs.image_url }}"
          ls -la work/input.bin

      - name: 提取并校验 arm64 Image（支持 Image / Image.gz / boot.img）
        env:
          KV: ${{ inputs.kernel_version }}
        run: |
          cd work
          python3 - <<'PY'
          import os, struct, gzip, shutil, re

          d = open("input.bin", "rb").read()
          if d[:8] == b"ANDROID!":
              # boot 镜像：v3/v4 头与 legacy 头都兼容，提取内核段
              ks = struct.unpack_from("<I", d, 8)[0]
              header_size = struct.unpack_from("<I", d, 20)[0]
              hv = struct.unpack_from("<I", d, 40)[0]
              if header_size >= 1580 and hv in (3, 4):
                  koff, ksize = 0x1000, ks          # v3/v4: 页固定 4096，内核在第 1 页
              else:
                  page = struct.unpack_from("<I", d, 36)[0] or 4096
                  koff, ksize = page, ks            # legacy: 内核在第 1 页
              open("kernel.blob", "wb").write(d[koff:koff + ksize])
              print("boot.img detected: kernel %d bytes @0x%x (header v%d)" % (ksize, koff, hv))
          else:
              shutil.copyfile("input.bin", "kernel.blob")
              print("raw blob: %d bytes" % len(d))

          k = open("kernel.blob", "rb").read()
          if k[:2] == b"\x1f\x8b":
              open("Image", "wb").write(gzip.decompress(k))
              print("gzip kernel decompressed")
          elif k[:4] == b"\x04\x22\x4d\x18":
              open("kernel.lz4", "wb").write(k)
              subprocess = __import__("subprocess")
              subprocess.run(["lz4", "-d", "-f", "kernel.lz4", "Image"], check=True)
              print("lz4 kernel decompressed")
          else:
              shutil.copyfile("kernel.blob", "Image")
              print("raw arm64 Image")

          img = open("Image", "rb").read()
          if img[0x38:0x3c] != b"ARM\x64":
              raise SystemExit("::error::不是 arm64 内核 Image（魔数 %r）" % img[0x38:0x3c])
          m = re.search(rb"Linux version [^\x00]{10,170}", img)
          ver = m.group(0).decode(errors="replace") if m else "Linux version ?"
          print("IMAGE OK: %d bytes" % len(img))
          print("Linux version:", ver[:160])
          kv = os.environ["KV"]
          toks = ver.split()
          real = toks[2] if len(toks) > 2 else "?"
          if not real.startswith(kv + "."):
              print("::warning::Image 实际版本 %s 与所选 CRC 表版本 %s 不一致，还原可能不适用" % (real, kv))
          PY

      - name: A17 CRC 还原（官方 LZ4 符号表）
        run: |
          python3 scripts/a17_crc_restore.py work/Image "${{ inputs.kernel_version }}"

      - name: 组装 AnyKernel3 卡刷包（A17 门控）
        env:
          VN: ${{ inputs.version_name }}
        run: |
          git clone --depth 1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 AnyKernel3
          rm -rf AnyKernel3/.git
          sed 's|@@TARGET_SYS@@|a17|' ak3-template/anykernel.sh > AnyKernel3/anykernel.sh
          grep -q 'TARGET_SYS="a17"' AnyKernel3/anykernel.sh || { echo "::error::A17 门控注入失败"; exit 1; }
          cp work/Image AnyKernel3/Image
          NAME="${VN:-songyuan-a17-${{ inputs.kernel_version }}}"
          ZIP="ReSukiSU_kernel-${NAME}-AnyKernel3.zip"
          (cd AnyKernel3 && zip -r -q -9 "../$ZIP" .)
          ls -la "$ZIP"
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          compression-level: 0

      - name: 上传到 Release（可选）
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "$ZIP_NAME" --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "${{ inputs.release_tag }}" "$ZIP_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "songyuan A17 kernel" --notes "官方基底 A17 门控包（自动构建）"
